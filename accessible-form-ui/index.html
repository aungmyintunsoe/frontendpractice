<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Form UI</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <main class="app-container">
        <form class="profile-form">
            <div class="input-group username-input">
                <label for="fullname">Fullname</label>
                <input type="text" id="fullname" placeholder="Enter your full name">
            </div>

            <div class="input-group email-input">
                <label for="emailAddress">Email</label>
                <input type="email" id="emailAddress" value="john@doe.com" aria-invalid="true"
                    aria-describedby="emailErrorMsg">
                <span class="error-msg" id="emailErrorMsg">Email is already taken.</span>

            </div>

            <div class="input-group password-input">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="xxxxxxx">
            </div>

            <div class="input-group confirm-password">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="xxxxxxx">
            </div>

            <button type="button" class="update-btn">Update Profile</button>
        </form>

        <aside class="dashboard">
            <div class="progress-circle">
                <span>65%</span>
            </div>
            <p class="profile-completeness">Profile Completeness</p>
            <ul class="check-list">
                <li class="checked">Create Account</li>
                <li class="checked">Update Roadmap Progress</li>
                <li class="checked">Setup Public Profile</li>
                <li>Complete your first project</li>
                <li>Invite your Friends</li>

            </ul>

        </aside>

    </main>

</body>

</html>
