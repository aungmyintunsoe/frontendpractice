<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="grid-container">
    <!-- Column 1 -->
        <div class="image-box box-1">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">
        </div>
        <div class="image-box box-2">
            <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f" alt="Room">
        </div>
        <!-- Column 2 -->
        <div class="image-box box-3">
            <img src="https://images.unsplash.com/photo-1478145046317-39f10e56b5e9" alt="Food">
        </div>
        <div class="image-box box-4">
            <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750" alt="Door">
        </div>
        <!-- Column 3 -->
        <div class="image-box box-5">
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab" alt="Apartment">
        </div>
        <div class="image-box box-6">
            <img src="image.png" alt="Beach View">
        </div>
        
    </main>

</body>
</html>
