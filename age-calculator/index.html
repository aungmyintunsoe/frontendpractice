<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Age Calculator</title>


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>

  <main class="app-container">
    <h2>Exact Age Calculator</h2>

    <div class="calculator-card">
      <label for="dob-input" class="subtitle">Select your birthdate:</label>


      <input type="text" id="dob-input" placeholder="Select Date...">

      <button id="calc-btn">Calculate exact age!</button>


      <div id="result" class="result-text"></div>
    </div>
  </main>


  <script type="module" src="/main.js"></script>
</body>

</html>
