<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Changelog</h1>
        <p>Here's everything you need to know</p>
    </header>
    <main>
        <section class="changelog-container">
            <div class="changelog-entry">
                <div class="date">March 3, 2026</div>
                <div class="dot"></div>
                <div class="content">Doing html/css</div>
            </div>

            <div class="changelog-entry">
                <div class="date">March 5, 2026</div>
                <div class="dot"></div>
                <div class="content">Javascript</div>
            </div>
            
            <div class="changelog-entry">
                <div class="date">March 7, 2026</div>
                <div class="dot"></div>
                <div class="content">React</div>
            </div>

            <div class="changelog-entry">
                <div class="date">March 10, 2026</div>
                <div class="dot"></div>
                <div class="content">Supabase</div>
            </div>

            <div class="changelog-entry">
                <div class="date">March 15, 2026</div>
                <div class="dot"></div>
                <div class="content">Tailwind</div>
            </div>

            <div class="changelog-entry">
                <div class="date">March 20, 2026</div>
                <div class="dot"></div>
                <div class="content">Next.js</div>
            </div>

            <div class="changelog-entry">
                <div class="date">March 25, 2026</div>
                <div class="dot"></div>
                <div class="content">Vercel</div>
            </div>

            <div class="changelog-entry">
                <div class="date">March 30, 2026</div>
                <div class="dot"></div>
                <div class="content">Github</div>
            </div>
            
        </section>
    </main>

    <footer>
        <button>Visit Complete Changelog</button>
    </footer>
    

</body>
</html>
